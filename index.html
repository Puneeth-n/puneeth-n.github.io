<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Puneeth N</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            line-height: 1.6;
            color: #333;
            background-color: #f5f5f5;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 2rem;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .profile {
            margin-bottom: 2rem;
        }

        .profile h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            color: #2d3748;
        }

        .profile p {
            font-size: 1.2rem;
            color: #4a5568;
            margin-bottom: 2rem;
        }

        .social-links {
            display: flex;
            gap: 1.5rem;
            justify-content: center;
        }

        .social-links a {
            text-decoration: none;
            color: #4a5568;
            font-size: 1.1rem;
            padding: 0.5rem 1rem;
            border: 2px solid #4a5568;
            border-radius: 5px;
            transition: all 0.3s ease;
        }

        .social-links a:hover {
            background-color: #4a5568;
            color: white;
        }

        @media (max-width: 600px) {
            .container {
                padding: 1rem;
            }
            
            .profile h1 {
                font-size: 2rem;
            }
            
            .social-links {
                flex-direction: column;
                gap: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="profile">
            <h1>Puneeth Nanjundaswamy</h1>
            <p>Software Engineer & Developer</p>
            <div class="social-links">
                <a href="https://linkedin.com/in/puneeth-n" target="_blank">LinkedIn</a>
                <a href="https://github.com/puneeth-n" target="_blank">GitHub</a>
            </div>
        </div>
    </div>
</body>
</html>
