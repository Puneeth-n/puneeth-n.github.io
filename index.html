<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Puneeth N</title>
    <style>
        :root[data-theme="light"] {
            --bg-color: #f5f5f5;
            --text-color: #333;
            --heading-color: #2d3748;
            --link-color: #4a5568;
            --link-border: #4a5568;
            --link-hover-bg: #4a5568;
            --link-hover-color: white;
        }

        :root[data-theme="dark"] {
            --bg-color: #1a1a1a;
            --text-color: #e2e8f0;
            --heading-color: #f7fafc;
            --link-color: #a0aec0;
            --link-border: #a0aec0;
            --link-hover-bg: #a0aec0;
            --link-hover-color: #1a1a1a;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            line-height: 1.6;
            color: var(--text-color);
            background-color: var(--bg-color);
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 2rem;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .profile {
            margin-bottom: 2rem;
        }

        .profile h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            color: var(--heading-color);
        }

        .profile p {
            font-size: 1.2rem;
            color: var(--text-color);
            margin-bottom: 2rem;
        }

        .social-links {
            display: flex;
            gap: 1.5rem;
            justify-content: center;
        }

        .social-links a {
            text-decoration: none;
            color: var(--link-color);
            font-size: 1.1rem;
            padding: 0.5rem 1rem;
            border: 2px solid var(--link-border);
            border-radius: 5px;
            transition: all 0.3s ease;
        }

        .social-links a:hover {
            background-color: var(--link-hover-bg);
            color: var(--link-hover-color);
        }

        .theme-toggle {
            position: fixed;
            top: 1rem;
            right: 1rem;
            background: none;
            border: 2px solid var(--link-border);
            color: var(--link-color);
            padding: 0.5rem;
            border-radius: 50%;
            cursor: pointer;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .theme-toggle:hover {
            background-color: var(--link-hover-bg);
            color: var(--link-hover-color);
        }

        @media (max-width: 600px) {
            .container {
                padding: 1rem;
            }
            
            .profile h1 {
                font-size: 2rem;
            }
            
            .social-links {
                flex-direction: column;
                gap: 1rem;
            }
        }
    </style>
</head>
<body>
    <button class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle theme">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
    </button>
    <div class="container">
        <div class="profile">
            <h1>Puneeth N</h1>
            <p>Software Engineer & Developer</p>
            <div class="social-links">
                <a href="https://linkedin.com/in/puneeth-n" target="_blank">LinkedIn</a>
                <a href="https://github.com/puneeth-n" target="_blank">GitHub</a>
            </div>
        </div>
    </div>

    <script>
        function toggleTheme() {
            const html = document.documentElement;
            const currentTheme = html.getAttribute('data-theme');
            const newTheme = currentTheme === 'light' ? 'dark' : 'light';
            
            html.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
        }

        // Check for saved theme preference or use system preference
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme) {
            document.documentElement.setAttribute('data-theme', savedTheme);
        } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
            document.documentElement.setAttribute('data-theme', 'dark');
        }
    </script>
</body>
</html>
